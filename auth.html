
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRIPCTRL | Login / Sign Up</title>
  <meta name="theme-color" content="#080808">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .auth-card {
      width: 100%;
      max-width: 410px;
      padding: 34px 26px;
      border: 1px solid #292929;
      background: #101010;
    }

    .brand {
      text-align: center;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .tagline {
      text-align: center;
      color: #999;
      font-size: 10px;
      letter-spacing: 3px;
      margin-bottom: 34px;
    }

    h1 {
      font-size: 23px;
      margin: 0 0 8px;
    }

    .subtitle {
      color: #aaa;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 12px;
      margin: 17px 0 8px;
      color: #ddd;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #373737;
      background: #080808;
      color: #fff;
      font-size: 14px;
      outline: none;
      border-radius: 0;
    }

    input:focus { border-color: #fff; }

    button {
      width: 100%;
      min-height: 47px;
      margin-top: 18px;
      padding: 13px;
      border: 1px solid #fff;
      background: #fff;
      color: #080808;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 1px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
      color: #fff;
      background: transparent;
      border-color: #393939;
    }

    .google-g {
      font-size: 19px;
      font-weight: bold;
      color: #4285F4;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #777;
      font-size: 10px;
      margin: 23px 0 5px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #303030;
      flex: 1;
    }

    .switch {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      margin-top: 24px;
    }

    .switch a, .forgot {
      color: #fff;
      text-decoration: underline;
      cursor: pointer;
    }

    .forgot {
      display: block;
      margin-top: 12px;
      font-size: 12px;
      text-align: right;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      border: 1px solid #444;
      color: #fff;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: #888;
      font-size: 12px;
      text-decoration: none;
    }

    .back:hover { color: #fff; }

    .fine-print {
      text-align: center;
      color: #666;
      font-size: 10px;
      line-height: 1.6;
      margin-top: 25px;
    }
  </style>
</head>

<body>
  <main class="auth-card">
    <div class="brand">DRIPCTRL</div>
    <div class="tagline">CONTROL THE DRIP.</div>

    <h1 id="heading">Welcome back.</h1>
    <div class="subtitle" id="subtitle">
      Sign in to your account and get back to your world.
    </div>

    <form id="authForm">
      <div id="nameField" hidden>
        <label for="name">YOUR NAME</label>
        <input id="name" type="text" autocomplete="name"
               placeholder="Your name">
      </div>

      <label for="email">EMAIL ADDRESS</label>
      <input id="email" type="email" autocomplete="email"
             placeholder="you@example.com" required>

      <label for="password">PASSWORD</label>
      <input id="password" type="password"
             autocomplete="current-password"
             minlength="6" placeholder="At least 6 characters"
             required>

      <a class="forgot" href="#" id="forgot">Forgot password?</a>

      <button id="submitBtn" type="submit">SIGN IN</button>
    </form>

    <div class="divider">OR CONTINUE WITH</div>

    <button type="button" class="google-btn" id="googleBtn">
      <span class="google-g">G</span>
      CONTINUE WITH GOOGLE
    </button>

    <div class="switch" id="switchText">
      New to DRIPCTRL?
      <a href="#" id="switchMode">Create account</a>
    </div>

    <div id="message" role="status" aria-live="polite"></div>

    <a class="back" href="/index.html">← BACK TO STORE</a>

    <div class="fine-print">
      DROP 01 · DRIPCTRL<br>
      By continuing, you agree to our applicable terms and policies.
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Your existing Supabase project configuration
    const SUPABASE_URL = "https://tmnkasyaeelcslbmmscu.supabase.co";
    const SUPABASE_ANON_KEY =
      "sb_publishable_nX3C5YVbYzQ0cN5A8LnkKg_WnKp3sZ_";

    const { createClient } = window.supabase;

    const supabaseClient = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const $ = (id) => document.getElementById(id);

    let mode = "login";
    let busy = false;

    function showMessage(text) {
      $("message").textContent = text;
      $("message").style.display = "block";
    }

    function clearMessage() {
      $("message").textContent = "";
      $("message").style.display = "none";
    }

    function setBusy(value) {
      busy = value;
      $("submitBtn").disabled = value;
      $("googleBtn").disabled = value;
      $("submitBtn").textContent = value
        ? "PLEASE WAIT..."
        : mode === "signup" ? "CREATE ACCOUNT" : "SIGN IN";
    }

    function setMode(nextMode) {
      mode = nextMode;
      clearMessage();

      const signup = mode === "signup";

      $("heading").textContent = signup
        ? "Create your account." : "Welcome back.";

      $("subtitle").textContent = signup
        ? "Join DRIPCTRL. Your next look starts here."
        : "Sign in to your account and get back to your world.";

      $("nameField").hidden = !signup;
      $("name").required = signup;
      $("password").autocomplete = signup
        ? "new-password" : "current-password";

      $("forgot").hidden = signup;
      $("switchText").innerHTML = signup
        ? 'Already have an account? <a href="#" id="switchMode">Sign in</a>'
        : 'New to DRIPCTRL? <a href="#" id="switchMode">Create account</a>';

      $("submitBtn").textContent = signup
        ? "CREATE ACCOUNT" : "SIGN IN";

      $("switchMode").addEventListener("click", (event) => {
        event.preventDefault();
        setMode(mode === "login" ? "signup" : "login");
      });
    }

    // Initial switch button handler
    $("switchMode").addEventListener("click", (event) => {
      event.preventDefault();
      setMode(mode === "login" ? "signup" : "login");
    });

    $("authForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (busy) return;

      clearMessage();

      const email = $("email").value.trim();
      const password = $("password").value;
      const name = $("name").value.trim();

      if (mode === "signup" && !name) {
        showMessage("Please enter your name.");
        return;
      }

      setBusy(true);

      try {
        if (mode === "signup") {
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
              data: { full_name: name },
              emailRedirectTo: window.location.origin + "/auth.html"
            }
          });

          if (error) throw error;

          if (data.session) {
            window.location.replace("/index.html");
            return;
          }

          showMessage(
            "Account created! Check your email for a confirmation link, then sign in."
          );
        } else {
          const { error } = await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          window.location.replace("/index.html");
          return;
        }
      } catch (error) {
        showMessage(error.message || "Authentication failed. Please try again.");
      } finally {
        setBusy(false);
      }
    });

    $("googleBtn").addEventListener("click", async () => {
      if (busy) return;

      clearMessage();
      setBusy(true);

      try {
        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: "google",
          options: {
            redirectTo: window.location.origin + "/index.html"
          }
        });

        if (error) throw error;
      } catch (error) {
        showMessage(error.message || "Google sign-in could not start.");
        setBusy(false);
      }
    });

    $("forgot").addEventListener("click", async (event) => {
      event.preventDefault();
      clearMessage();

      const email = $("email").value.trim();

      if (!email) {
        showMessage("Enter your email address first, then tap Forgot password.");
        $("email").focus();
        return;
      }

      setBusy(true);

      try {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(
          email,
          {
            redirectTo: window.location.origin + "/auth.html"
          }
        );

        if (error) throw error;

        showMessage("If the account is registered, a password reset email will be sent.");
      } catch (error) {
        showMessage(error.message || "Could not send the reset email.");
      } finally {
        setBusy(false);
      }
    });

    // Handle a user returning from an email confirmation link.
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY") {
        showMessage("Password recovery verified. Add a password reset form to finish changing your password.");
      }
    });

    setMode("login");
  </script>
</body>
</html>
